[lib]
name = "siestaloader"
version = "0.1.0"
entry = "siestaloader/lib.ykn"
yukino = ["0.1.0", "+"] # [min, max]
output = "macro"
includes = ["core", "stdlib", "macrosdk"]

[test]
threads = "auto"
